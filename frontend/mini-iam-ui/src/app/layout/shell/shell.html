<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="brand">
      <mat-icon>admin_panel_settings</mat-icon>
      Mini IAM
    </div>
    <div class="section">Menu</div>
    <mat-nav-list aria-label="Main menu">
      @for (item of menu; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active" #rla="routerLinkActive"
           [activated]="rla.isActive" [attr.data-testid]="'nav-' + item.path">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <span class="spacer"></span>
      <span class="user">
        <mat-icon>account_circle</mat-icon>
        {{ auth.username }}
      </span>
      <button mat-stroked-button type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    </mat-toolbar>

    <main class="content">
      <div class="container">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
