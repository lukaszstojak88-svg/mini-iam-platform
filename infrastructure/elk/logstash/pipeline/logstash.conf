# Mini IAM log pipeline (spec §16.4): Filebeat -> normalization -> Elasticsearch.
input {
  beats {
    port => 5044
  }
}

filter {
  # service.name comes from ECS JSON; fall back to the Docker Compose service name for non-JSON lines.
  if ![service][name] and [docker][container][labels][com_docker_compose_service] {
    mutate {
      add_field => { "[service][name]" => "%{[docker][container][labels][com_docker_compose_service]}" }
    }
  }

  # Drop noisy metadata that is not useful for tracing requests.
  mutate {
    remove_field => ["[docker][container][labels]", "[log][file]", "[event][original]", "@version", "tags"]
  }

  # Safety net: never store bearer tokens, even if one accidentally ends up in a log message.
  mutate {
    gsub => [
      "message", "(?i)(bearer\s+)[A-Za-z0-9\-_\.=]+", "\1[REDACTED]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    index => "mini-iam-logs-%{+YYYY.MM.dd}"
    data_stream => false
    ilm_enabled => false
    manage_template => false
  }
}
