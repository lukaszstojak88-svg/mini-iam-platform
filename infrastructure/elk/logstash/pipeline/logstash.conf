# Mini IAM log pipeline (spec §16.4): Filebeat -> normalization -> Elasticsearch.
input {
  beats {
    port => 5044
  }
}

filter {
  # service.name comes from ECS JSON; fall back to the Docker Compose service name for non-JSON lines.
  if ![service][name] and [docker][container][labels][com_docker_compose_service] {
    mutate {
      add_field => { "[service][name]" => "%{[docker][container][labels][com_docker_compose_service]}" }
    }
  }

  # Drop noisy metadata that is not useful for tracing requests.
  mutate {
    remove_field => ["[docker][container][labels]", "[log][file]", "[event][original]", "@version", "tags"]
  }

  # Safety net (spec §11.1, §16.3): services never log credentials, but if one slips into a message or an
  # exception, it is masked before it reaches Elasticsearch. This is a heuristic, not a guarantee. Order matters:
  # whole JWTs, Bearer/Basic credentials, "key":"quoted value" (whole value, also with spaces), key=value.
  mutate {
    gsub => [
      "message", "eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*", "[REDACTED_JWT]",
      "message", "(?i)\b(bearer)\s+[A-Za-z0-9\-_\.=+/]+", "\1 [REDACTED]",
      "message", "\b([Bb][Aa][Ss][Ii][Cc])\s+(?=.[A-Za-z0-9+/]*[A-Z0-9+/=])[A-Za-z0-9+/]{8,}={0,2}", "\1 [REDACTED]",
      "message", "(?i)(\"(?:password|passwd|temporaryPassword|secret|client_secret|clientSecret|access_token|refresh_token|id_token)\"\s*:\s*\")[^\"]*", "\1[REDACTED]",
      "message", "(?i)(\"?(?:password|passwd|temporaryPassword|secret|client_secret|clientSecret|access_token|refresh_token|id_token)\"?\s*[:=]\s*\"?)[^\"&,\s}]+", "\1[REDACTED]",
      "[error][message]", "eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*", "[REDACTED_JWT]",
      "[error][message]", "(?i)\b(bearer)\s+[A-Za-z0-9\-_\.=+/]+", "\1 [REDACTED]",
      "[error][message]", "\b([Bb][Aa][Ss][Ii][Cc])\s+(?=.[A-Za-z0-9+/]*[A-Z0-9+/=])[A-Za-z0-9+/]{8,}={0,2}", "\1 [REDACTED]",
      "[error][message]", "(?i)(\"(?:password|passwd|temporaryPassword|secret|client_secret|clientSecret|access_token|refresh_token|id_token)\"\s*:\s*\")[^\"]*", "\1[REDACTED]",
      "[error][message]", "(?i)(\"?(?:password|passwd|temporaryPassword|secret|client_secret|clientSecret|access_token|refresh_token|id_token)\"?\s*[:=]\s*\"?)[^\"&,\s}]+", "\1[REDACTED]",
      "[error][stack_trace]", "eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*", "[REDACTED_JWT]",
      "[error][stack_trace]", "(?i)\b(bearer)\s+[A-Za-z0-9\-_\.=+/]+", "\1 [REDACTED]",
      "[error][stack_trace]", "\b([Bb][Aa][Ss][Ii][Cc])\s+(?=.[A-Za-z0-9+/]*[A-Z0-9+/=])[A-Za-z0-9+/]{8,}={0,2}", "\1 [REDACTED]",
      "[error][stack_trace]", "(?i)(\"(?:password|passwd|temporaryPassword|secret|client_secret|clientSecret|access_token|refresh_token|id_token)\"\s*:\s*\")[^\"]*", "\1[REDACTED]",
      "[error][stack_trace]", "(?i)(\"?(?:password|passwd|temporaryPassword|secret|client_secret|clientSecret|access_token|refresh_token|id_token)\"?\s*[:=]\s*\"?)[^\"&,\s}]+", "\1[REDACTED]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    index => "mini-iam-logs-%{+YYYY.MM.dd}"
    data_stream => false
    ilm_enabled => false
    manage_template => false
  }
}
