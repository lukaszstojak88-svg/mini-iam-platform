server:
  port: ${AUDIT_SERVICE_PORT:8083}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: audit-service
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer is always validated against the "iss" claim. Keys are fetched from jwk-set-uri, so inside
          # Docker the JWKS can come from http://keycloak:8080 while the issuer stays http://localhost:8080.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mini-iam}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/mini-iam/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_AUDIENCE:mini-iam-api}
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  datasource:
    url: ${AUDIT_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/mini_iam}
    username: ${AUDIT_SERVICE_DB_USERNAME:audit_service}
    password: ${AUDIT_SERVICE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: audit
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: audit
    liquibase-schema: audit

app:
  security:
    # Optional: also map resource_access.<client-id>.roles (Keycloak client roles). Empty = realm roles only.
    client-id: ${KEYCLOAK_CLIENT_ROLES_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Human-readable text format by default (local run). The Docker image sets
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs -> JSON/ECS on stdout (spec §16.1).
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name},%X{correlationId:-}] %logger{36} : %m%n"
