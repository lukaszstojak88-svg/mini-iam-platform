server:
  port: ${USER_SERVICE_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: user-service
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer is always validated against the "iss" claim. Keys are fetched from jwk-set-uri, so inside
          # Docker the JWKS can come from http://keycloak:8080 while the issuer stays http://localhost:8080.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mini-iam}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/mini-iam/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_AUDIENCE:mini-iam-api}
      client:
        # Technical client used for the Keycloak Admin REST API (spec §5.4) and service-to-service calls (spec §7).
        # The secret has no default on purpose.
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:mini-iam-admin}
            client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/mini-iam/protocol/openid-connect/token}
  cloud:
    openfeign:
      client:
        config:
          audit-service:
            url: ${AUDIT_SERVICE_URL:http://localhost:8083}
            connect-timeout: 2000
            # Short read timeout: auditing is best effort and runs in the request thread after the operation.
            read-timeout: 2000
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  datasource:
    url: ${USER_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/mini_iam}
    username: ${USER_SERVICE_DB_USERNAME:user_service}
    password: ${USER_SERVICE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: users
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: users
    liquibase-schema: users

app:
  security:
    # Optional: also map resource_access.<client-id>.roles (Keycloak client roles). Empty = realm roles only.
    client-id: ${KEYCLOAK_CLIENT_ROLES_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  keycloak:
    admin:
      # Keycloak base URL used for Admin REST API calls (inside Docker: http://keycloak:8080)
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
      realm: ${KEYCLOAK_REALM:mini-iam}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Human-readable text format by default (local run). The Docker image sets
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs -> JSON/ECS on stdout (spec §16.1).
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name},%X{correlationId:-}] %logger{36} : %m%n"
