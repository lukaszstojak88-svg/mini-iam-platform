# Application user profiles (spec §8.1). Passwords, password hashes and tokens are never stored here.
databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: mini-iam
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: keycloak_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_users_keycloak_id
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createIndex:
            tableName: users
            indexName: ix_users_username
            columns:
              - column:
                  name: username
        - createIndex:
            tableName: users
            indexName: ix_users_email
            columns:
              - column:
                  name: email
      rollback:
        - dropTable:
            tableName: users
